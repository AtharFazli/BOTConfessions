<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOTConfessions</title>
<style>
:root{--bg:#0f0f13;--card:#16161e;--card2:#1c1c26;--border:#2a2a38;--text:#e8e8ed;--muted:#888;--accent:#ff5c6c;--accent-dim:#ff5c6c44;--font:'Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{text-align:center;padding:2rem 1rem 1rem;width:100%;max-width:600px}
.header h1{font-size:1.6rem;font-weight:600;letter-spacing:-.5px}
.header h1 span{color:var(--accent)}
.header p{color:var(--muted);font-size:.85rem;margin-top:.3rem}
.stats{display:flex;gap:1.5rem;justify-content:center;margin:1rem 0 1.2rem;font-size:.85rem}
.stats span{color:var(--muted)}
.stats strong{color:var(--text)}
.network{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:1rem;flex-wrap:wrap}
#status{padding:4px 12px;border-radius:20px;font-size:.75rem;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--muted);transition:.15s}
#status.on{background:#1a2e1a;border-color:#2a5a2a;color:#5f5}
#status.off{background:#2e1a1a;border-color:#5a2a2a;color:#f55}
#status:hover{filter:brightness(1.2)}
.network a{color:var(--muted);font-size:.75rem}
.compose-area{width:100%;max-width:600px;padding:0 1rem;margin-bottom:1.5rem}
.compose-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem}
.compose-card textarea{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:.95rem;resize:none;min-height:80px;outline:none;padding:0;line-height:1.5}
.compose-card textarea::placeholder{color:var(--muted)}
.compose-foot{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem}
.char-count{color:var(--muted);font-size:.8rem;transition:.15s}
.char-count.full{color:#f90}
#btnPost{background:var(--accent);color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:.85rem;font-weight:500;cursor:pointer;transition:.15s}
#btnPost:disabled{opacity:.4;cursor:default}
#btnPost:not(:disabled):hover{filter:brightness(1.15)}
#list{width:100%;max-width:600px;padding:0 1rem 2rem;display:flex;flex-direction:column;gap:.6rem}
.card{display:flex;flex-direction:column;gap:.5rem;padding:1rem;background:var(--card);border:1px solid var(--border);border-radius:10px;animation:fadeIn .3s ease forwards;opacity:0;transition:.15s}
.card:nth-child(2n){background:var(--card2)}
@keyframes fadeIn{to{opacity:1}}
.card .msg{font-size:.95rem;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.card .meta{display:flex;justify-content:space-between;align-items:center}
.card .anon{font-size:.75rem;color:var(--muted);font-family:monospace}
.hearts{display:flex;align-items:center;gap:6px}
.hearts span{font-size:.85rem;min-width:1.2rem;color:var(--muted)}
.heart-btn{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:2px 6px;border-radius:6px;transition:.15s}
.heart-btn:not(:disabled):hover{background:var(--accent-dim);color:var(--accent)}
.heart-btn.hearted,.heart-btn:disabled{color:var(--accent);opacity:.7;cursor:default}
.btn-load-more{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.7rem;font-size:.85rem;cursor:pointer;width:100%;transition:.15s}
.btn-load-more:hover{background:var(--border)}
.empty{padding:2rem;text-align:center;color:var(--muted);font-size:.9rem}
@media(max-width:500px){.header h1{font-size:1.3rem}.stats{gap:1rem;font-size:.8rem}}
</style>
</head>
<body>
<div class="header">
  <h1>BOT<span>Confessions</span></h1>
  <p>Anonymous confessions on <span id="chainSymbolLabel">??</span> chain</p>
  <div class="stats">
    <span>📝 <strong id="statPosts">0</strong> confessions</span>
    <span>♥ <strong id="statHearts">0</strong></span>
  </div>
  <div class="network">
    <span id="status">Loading...</span>
    <a id="explorerLink" href="#" target="_blank" rel="noopener">🔍</a>
  </div>
</div>
<div class="compose-area">
  <div class="compose-card">
    <textarea id="input" placeholder="Write your confession... (max 500 chars)" maxlength="500"></textarea>
    <div class="compose-foot">
      <span class="char-count"><span id="charCount">0</span> / 500</span>
      <button id="btnPost" disabled>Post</button>
    </div>
  </div>
</div>
<div id="list">
  <div class="empty">Loading...</div>
</div>
<div class="header" style="padding:.5rem">
  <p style="font-size:.7rem;color:var(--muted)">BOTConfessions · on-chain &amp; anonymous</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/web3@1/dist/web3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
const ABI = [
  {inputs:[{internalType:"string",name:"_message",type:"string"}],name:"postConfession",outputs:[],stateMutability:"payable",type:"function"},
  {inputs:[{internalType:"uint256",name:"_index",type:"uint256"}],name:"heart",outputs:[],stateMutability:"payable",type:"function"},
  {inputs:[],name:"getConfessions",outputs:[{components:[{internalType:"uint256",name:"id",type:"uint256"},{internalType:"string",name:"message",type:"string"},{internalType:"uint256",name:"hearts",type:"uint256"}],internalType:"struct BOTConfessions.Confession[]",name:"",type:"tuple[]"}],stateMutability:"view",type:"function"},
  {inputs:[],name:"getCount",outputs:[{internalType:"uint256",name:"",type:"uint256"}],stateMutability:"view",type:"function"},
  {inputs:[{internalType:"uint256",name:"",type:"uint256"},{internalType:"address",name:"",type:"address"}],name:"hasHearted",outputs:[{internalType:"bool",name:"",type:"bool"}],stateMutability:"view",type:"function"}
];
const CONTRACT = "0x04e6db5BE9861fbEd3E7a4192A3444a7D0e07cb4";
const $ = s => document.querySelector(s);
const statusEl = $('#status'), inputEl = $('#input'), charCount = $('#charCount');
const btnPost = $('#btnPost'), listEl = $('#list');
const statPosts = $('#statPosts'), statHearts = $('#statHearts');
const TESTNET_CHAIN = {id:968,hex:'0x3c8',label:'testnet',rpc:'https://rpc.bohr.life',explorer:'https://scan.bohr.life',symbol:'tBOT',name:'BOT Chain Testnet'};
const MAINNET_CHAIN = {id:677,hex:'0x2a5',label:'mainnet',rpc:'https://rpc.botchain.ai',explorer:'https://scan.botchain.ai',symbol:'BOT',name:'BOT Chain'};
const CHAIN = TESTNET_CHAIN;
const POST_PRICE = '1000000000000000';
const HEART_PRICE = '1000000000000000';
const PAGE_SIZE = 50;

const RPC = CHAIN.rpc;
let web3 = new Web3(RPC);
let contract = new web3.eth.Contract(ABI, CONTRACT);
let account;
let loadingList = false;
let cachedAll = null;

$('#chainSymbolLabel').textContent = CHAIN.symbol;
$('#btnPost').textContent = 'Post · 0.001 ' + CHAIN.symbol;
$('#explorerLink').href = CHAIN.explorer + '/address/' + CONTRACT;

loadStats(); loadList();

inputEl.oninput = () => {
  const len = inputEl.value.length;
  charCount.textContent = len;
  charCount.parentElement.className = 'char-count' + (len >= 450 ? ' full' : '');
};

async function checkChain(skipSwitch) {
  const id = await web3.eth.getChainId();
  if (String(id) === String(CHAIN.id) || String(id) === CHAIN.hex) return true;
  statusEl.className = 'off';
  statusEl.textContent = 'Switch to ' + CHAIN.name + ' (ID ' + CHAIN.id + ')';
  btnPost.disabled = true;
  if (!skipSwitch) {
    try { await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN.hex}]}); }
    catch (e) {
      if (e.code === 4902) {
        try { await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:CHAIN.hex,chainName:CHAIN.name,rpcUrls:[CHAIN.rpc],nativeCurrency:{name:CHAIN.symbol,symbol:CHAIN.symbol,decimals:18},blockExplorerUrls:[CHAIN.explorer]}]}); }
        catch (e2) { if (e2.code !== 4001) statusEl.textContent = 'Add ' + CHAIN.rpc + ', chain ' + CHAIN.id; }
      } else if (e.code !== 4001) statusEl.textContent = 'Switch to ' + CHAIN.name + ' (ID ' + CHAIN.id + ')';
    }
  }
  return false;
}

async function init() {
  if (!window.ethereum) { statusEl.textContent = 'Install MetaMask or OKX Wallet'; return; }
  web3 = new Web3(window.ethereum);
  try {
    let accounts = await window.ethereum.request({method:'eth_accounts'});
    if (!accounts || accounts.length === 0) accounts = await window.ethereum.request({method:'eth_requestAccounts'});
    if (!accounts || !accounts[0]) { statusEl.textContent = 'No accounts'; return; }
    account = accounts[0];
    contract = new web3.eth.Contract(ABI, CONTRACT);
    if (!await checkChain()) {
      await new Promise(r => setTimeout(r, 1000));
      if (!await checkChain(true)) return;
    }
    statusEl.className = 'on';
    statusEl.textContent = CHAIN.name + ' · ' + account.slice(0,6) + '...' + account.slice(-4);
    btnPost.disabled = false;
    loadStats(); loadList();
    window.ethereum.on('accountsChanged',([a])=>{if(a){account=a;location.reload()}else{location.reload()}});
    window.ethereum.on('chainChanged',()=>location.reload());
  } catch(e) { statusEl.textContent = e.code === 4001 ? 'Rejected' : (e.message||String(e)).slice(0,60); }
}

btnPost.onclick = async () => {
  const msg = inputEl.value.trim();
  if (!msg || !contract || !account) return;
  btnPost.disabled = true; btnPost.textContent = 'Sending...';
  try {
    const gp = await web3.eth.getGasPrice();
    await contract.methods.postConfession(msg).send({from:account,value:POST_PRICE,gasPrice:gp});
    inputEl.value = ''; charCount.textContent = '0'; charCount.parentElement.className = 'char-count';
    loadStats(); loadList();
    Swal.fire({icon:'success',title:'Posted!',text:'Confession on-chain.',timer:2000,showConfirmButton:false,background:'#12121a',color:'#eee',iconColor:'#ff5c6c'});
  } catch(e) { Swal.fire({icon:'error',title:'Failed',text:(e.message||e).slice(0,80),background:'#12121a',color:'#eee',iconColor:'#ff5c6c'}); }
  btnPost.disabled = false; btnPost.textContent = 'Post · 0.001 ' + CHAIN.symbol;
};

async function loadStats() {
  if (!contract) return;
  try {
    const count = await contract.methods.getCount().call();
    statPosts.textContent = count.toString();
  } catch(e) {}
}

async function loadList(append) {
  if (!contract || loadingList) return;
  loadingList = true;
  try {
    // ponytail: on-chain contract only has getConfessions(), not getConfessionsRange
    // fetch all, slice client-side
    let all = cachedAll;
    if (!all) {
      all = await contract.methods.getConfessions().call();
      cachedAll = all;
    }
    const total = all.length;
    if (total === 0) { listEl.innerHTML = '<div class="empty">No confessions yet. Be the first!</div>'; loadingList = false; return; }
    let start, fetchCount = PAGE_SIZE, html = '', totalH = 0;
    if (append) {
      const btns = document.querySelectorAll('.heart-btn');
      if (btns.length === 0) {
        start = Math.max(0, total - PAGE_SIZE);
      } else {
        let minIdx = Infinity, maxIdx = -1;
        btns.forEach(b => { const i = parseInt(b.dataset.idx); if (i < minIdx) minIdx = i; if (i > maxIdx) maxIdx = i; });
        document.querySelectorAll('.card .hearts span').forEach(s => totalH += Number(s.textContent));
        if (minIdx > 0) {
          fetchCount = Math.min(PAGE_SIZE, minIdx);
          start = minIdx - fetchCount;
        } else {
          loadingList = false; return;
        }
      }
    } else {
      start = Math.max(0, total - PAGE_SIZE);
    }
    const data = all.slice(start, start + fetchCount);
    if (data.length === 0) { if (!append) listEl.innerHTML = '<div class="empty">No confessions yet. Be the first!</div>'; loadingList = false; return; }
    for (let i = data.length - 1; i >= 0; i--) {
      const c = data[i];
      const idx = start + i;
      totalH += Number(c.hearts);
      html += `<div class="card" style="animation-delay:${(data.length-1-i)*40}ms">
        <div class="msg">${esc(c.message)}</div>
        <div class="meta">
          <span class="anon">#${trunc(c.id.toString())}</span>
          <div class="hearts">
            <button class="heart-btn" data-idx="${idx}" onclick="heartify(${idx})">♥</button>
            <span>${c.hearts}</span>
          </div>
        </div>
      </div>`;
    }
    const oldBtn = listEl.querySelector('.btn-load-more');
    if (oldBtn) oldBtn.remove();
    if (append) {
      listEl.innerHTML = listEl.innerHTML + html;
    } else {
      listEl.innerHTML = html;
    }
    if (start > 0) {
      const btn = document.createElement('button');
      btn.className = 'btn-load-more';
      btn.textContent = 'Load more';
      btn.onclick = () => loadList(true);
      listEl.appendChild(btn);
    }
    statHearts.textContent = totalH.toString();
    if (account) {
      document.querySelectorAll('.heart-btn:not([data-checked])').forEach(async (btn) => {
        btn.dataset.checked = '1';
        try {
          if (await contract.methods.hasHearted(parseInt(btn.dataset.idx), account).call()) {
            btn.disabled = true; btn.classList.add('hearted');
          }
        } catch(e) {}
      });
    }
  } catch(e) { console.error(e); listEl.innerHTML = 'Load failed: ' + (e.message||String(e)).slice(0,120); } finally { loadingList = false; }
}
function heartify(idx) {
  if (!account) {
    Swal.fire({icon:'info',title:'Connect Wallet',text:'Connect wallet to send a heart.',showCancelButton:true,confirmButtonColor:'#ff5c6c',cancelButtonColor:'#333',background:'#12121a',color:'#eee',iconColor:'#ff5c6c'}).then(r=>{if(r.isConfirmed) init()});
    return;
  }
  (async () => {
    try {
      const gp = await web3.eth.getGasPrice();
      await contract.methods.heart(idx).send({from:account,value:HEART_PRICE,gasPrice:gp});
      const card = document.querySelector(`.card .heart-btn[data-idx="${idx}"]`);
      if (card) {
        card.disabled = true; card.classList.add('hearted');
        const span = card.nextElementSibling;
        if (span) {
          span.textContent = String(parseInt(span.textContent) + 1);
          statHearts.textContent = String(parseInt(statHearts.textContent) + 1);
        }
      }
      Swal.fire({icon:'success',title:'Heart sent!',timer:1500,showConfirmButton:false,background:'#12121a',color:'#eee',iconColor:'#ff5c6c'});
    } catch(e) { Swal.fire({icon:'error',title:'Failed',text:(e.message||e).slice(0,80),background:'#12121a',color:'#eee',iconColor:'#ff5c6c'}); }
  })();
}
function esc(s) {const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function trunc(s){return s.length>40?s.slice(0,5)+'******'+s.slice(-5):s;}
btnPost.disabled = true;
statusEl.onclick = init;
</script>
</body>
</html>
